<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flat Animator</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .anim-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px; }
    @media (max-width: 900px) { .anim-layout { grid-template-columns: 1fr; } }
    .stage { display: flex; justify-content: center; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
    #canvas { max-width: 100%; max-height: 70vh; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.35); background: #fff; }
    #script { font: 12px/1.45 ui-monospace, Menlo, monospace; min-height: 260px; }
    #scrub { width: 100%; accent-color: var(--accent); padding: 0; }
    .time { color: var(--muted); font-size: 12px; min-width: 90px; text-align: right; }
    #status { min-height: 18px; }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▶</span>
      <div>
        <h1>Flat Animator</h1>
        <p>Turn a scene script into a flat motion-graphics video</p>
      </div>
    </div>
    <div class="connections"><a class="btn small" href="/">← Back to workflows</a></div>
  </header>

  <main class="anim-layout">
    <section class="editor">
      <div class="card">
        <div class="row">
          <label class="grow">Format
            <select id="format">
              <option value="">From script</option>
              <option value="portrait">Portrait 9:16 (Shorts, Reels)</option>
              <option value="landscape">Landscape 16:9 (YouTube)</option>
              <option value="square">Square 1:1</option>
            </select>
          </label>
          <label class="grow">Colour style
            <select id="palette">
              <option value="">From script</option>
              <option value="purple">Purple pop</option>
              <option value="clean">Clean white + red</option>
              <option value="warm">Warm orange + green</option>
              <option value="night">Night blue</option>
              <option value="sky">Light grey + sky blue</option>
            </select>
          </label>
        </div>
        <label>Animation script (JSON from the "Flat animation" workflow)
          <textarea id="script" spellcheck="false"></textarea>
        </label>
        <div class="row">
          <button class="btn" id="load">Apply script</button>
          <button class="btn ghost" id="sample">Load example</button>
        </div>
        <p id="status" class="hint"></p>
      </div>
    </section>

    <section class="output">
      <div class="stage"><canvas id="canvas"></canvas></div>
      <div class="row" style="align-items:center">
        <button class="btn" id="play">▶ Play</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" class="grow" />
        <span class="time" id="time">0.0 / 0.0s</span>
      </div>
      <div class="row">
        <button class="btn primary grow" id="record">⬇ Record &amp; download video</button>
      </div>
      <p class="hint">Recording plays the whole video once in real time. Keep this tab open until the download starts.
        Add music or a voiceover afterwards in Google Vids, CapCut or YouTube.</p>
    </section>
  </main>

  <script type="module">
    import { parseScript, renderFrame, totalDuration, canvasSize, SAMPLE_SCRIPT } from "./animator.js";

    const $ = (s) => document.querySelector(s);
    const canvas = $("#canvas");
    const ctx = canvas.getContext("2d");
    let script = null;
    let duration = 0;
    let time = 0;
    let playing = false;
    let last = 0;

    function status(msg, isError = false) {
      $("#status").textContent = msg;
      $("#status").className = isError ? "hint err" : "hint";
    }

    function apply() {
      try {
        const parsed = parseScript($("#script").value);
        if ($("#format").value) parsed.format = $("#format").value;
        if ($("#palette").value) parsed.palette = $("#palette").value;
        script = parsed;
        const [w, h] = canvasSize(script);
        canvas.width = w;
        canvas.height = h;
        duration = totalDuration(script);
        time = Math.min(time, duration);
        draw();
        status(`${script.scenes.length} scenes, ${duration.toFixed(1)} seconds.`);
        try { localStorage.setItem("animator-script", $("#script").value); } catch {}
      } catch (err) {
        status("Could not read the script: " + err.message, true);
      }
    }

    function draw() {
      if (!script) return;
      renderFrame(ctx, script, time);
      $("#scrub").value = duration ? Math.round((time / duration) * 1000) : 0;
      $("#time").textContent = `${time.toFixed(1)} / ${duration.toFixed(1)}s`;
    }

    function loop(now) {
      if (!playing) return;
      time += (now - last) / 1000;
      last = now;
      if (time >= duration) { time = duration; playing = false; $("#play").textContent = "▶ Play"; }
      draw();
      if (playing) requestAnimationFrame(loop);
    }

    function play() {
      if (!script) return;
      if (time >= duration) time = 0;
      playing = true;
      last = performance.now();
      $("#play").textContent = "❚❚ Pause";
      requestAnimationFrame(loop);
    }

    $("#play").onclick = () => {
      if (playing) { playing = false; $("#play").textContent = "▶ Play"; } else play();
    };
    $("#scrub").oninput = () => { playing = false; $("#play").textContent = "▶ Play"; time = ($("#scrub").value / 1000) * duration; draw(); };
    $("#load").onclick = apply;
    $("#format").onchange = apply;
    $("#palette").onchange = apply;
    $("#sample").onclick = () => { $("#script").value = JSON.stringify(SAMPLE_SCRIPT, null, 2); apply(); };

    function pickMime() {
      const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
      return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    }

    $("#record").onclick = () => {
      if (!script) return;
      if (!window.MediaRecorder || !canvas.captureStream) return status("This browser can't record video. Try Chrome.", true);
      const mime = pickMime();
      const stream = canvas.captureStream(30);
      const rec = new MediaRecorder(stream, { mimeType: mime || undefined, videoBitsPerSecond: 8_000_000 });
      const chunks = [];
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onstop = () => {
        const type = rec.mimeType || mime || "video/webm";
        const ext = type.includes("mp4") ? "mp4" : "webm";
        const blob = new Blob(chunks, { type });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `animation-${Date.now()}.${ext}`;
        a.click();
        $("#record").disabled = false;
        status(`Saved ${ext.toUpperCase()} (${(blob.size / 1e6).toFixed(1)} MB).` + (ext === "webm" ? " If your editor can't open WebM, convert it to MP4 (e.g. CapCut opens it directly)." : ""));
      };
      $("#record").disabled = true;
      time = 0;
      draw();
      rec.start(250);
      status("Recording… keep this tab open.");
      playing = true;
      last = performance.now();
      const tick = (now) => {
        time += (now - last) / 1000;
        last = now;
        if (time >= duration) { time = duration; draw(); playing = false; setTimeout(() => rec.stop(), 300); return; }
        draw();
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };

    let saved = null;
    try { saved = localStorage.getItem("animator-script"); } catch {}
    $("#script").value = saved || JSON.stringify(SAMPLE_SCRIPT, null, 2);
    apply();
  </script>
</body>
</html>
