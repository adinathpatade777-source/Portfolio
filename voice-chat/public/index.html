<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Chat with GPT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Voice Chat <span>with GPT</span></h1>
      <div class="settings">
        <label>Voice
          <select id="voice">
            <option>alloy</option><option>ash</option><option>ballad</option><option>coral</option>
            <option>echo</option><option>fable</option><option>nova</option><option>onyx</option>
            <option>sage</option><option>shimmer</option>
          </select>
        </label>
        <label class="toggle"><input type="checkbox" id="handsfree" /> Hands-free</label>
        <button id="clear" class="ghost" title="Start a new conversation">New chat</button>
        <button id="keyBtn" class="ghost" hidden>API key</button>
      </div>
    </header>

    <form id="keyForm" class="key-form" hidden>
      <p><strong>Enter your OpenAI API key</strong> to start. It is saved only in this browser and sent only to OpenAI.
        Get one at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a>.</p>
      <div class="row">
        <input id="keyInput" type="password" placeholder="sk-..." autocomplete="off" />
        <button type="submit">Save</button>
      </div>
    </form>

    <section id="log" class="log" aria-live="polite">
      <p class="empty">Tap the microphone and start talking.</p>
    </section>

    <footer class="controls">
      <div id="status" class="status">Ready</div>
      <button id="mic" class="mic" aria-label="Start talking">
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
        <span class="ring"></span>
      </button>
      <button id="stop" class="ghost" hidden>Stop speaking</button>
      <form id="textForm" class="text-form">
        <input id="textInput" type="text" placeholder="…or type a message" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
